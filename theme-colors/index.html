<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>テーマカラー調整</title>
<style>
:root{--bg:#F7F8FA;--surface:#fff;--border:#E4E7EC;--text:#111827;--sub:#6B7280;--muted:#9CA3AF;--danger:#D6363C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,-apple-system,sans-serif;font-size:13px}
main{max-width:1250px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:18px;margin:0 0 14px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:#fff;font:inherit;font-weight:600;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-size:16px;margin:0}
.head .desc{color:var(--sub);font-size:12px}
.picker{display:flex;align-items:center;gap:8px;margin-left:auto}
.picker input[type=color]{width:40px;height:36px;border:1px solid var(--border);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.picker input[type=text]{width:96px;height:36px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font:inherit;font-family:ui-monospace,monospace;text-transform:uppercase}
.cr{font-size:11px;color:var(--sub);white-space:nowrap}
.cr.ng{color:var(--danger)}
.body{display:grid;grid-template-columns:260px 1fr;gap:18px}
@media (max-width:760px){.body{grid-template-columns:1fr}.picker{margin-left:0}}
.parts{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:30px;border-radius:7px;border:1px solid rgba(0,0,0,.06)}
.lbl{color:var(--sub);font-size:11px}
.sbtn{height:32px;padding:0 14px;border:none;border-radius:8px;color:#fff;font:inherit;font-weight:600}
.tab{height:30px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;font-weight:600}
.badge{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.link{font-weight:600}
.cb{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.apps{display:flex;flex-wrap:wrap;gap:14px 20px}
.app{width:150px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pair{display:flex;gap:8px}
.logo{width:52px;height:52px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.logo svg{width:30px;height:30px}
.tile{width:52px;height:52px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.tile svg{width:26px;height:26px}
.app .n{font-size:11px;font-weight:600}
.strip{display:flex;gap:8px;flex-wrap:wrap}
.strip div{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-weight:600}
.strip span{width:22px;height:22px;border-radius:6px;display:inline-block}
textarea{width:100%;height:120px;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}
</style>
</head>
<body>
<main>
<h1>テーマカラー調整</h1>
<div class="strip" id="strip"></div>
<div class="top" style="margin-top:12px">
  <button class="btn" id="reset" type="button">はじめの色に戻す</button>
  <button class="btn" id="copy" type="button">決めた色をコピー</button>
</div>
<div id="list"></div>
<div class="card"><div class="head"><h2>決めた色</h2></div><textarea id="out" readonly></textarea></div>
</main>
<script>
const DOMAINS = [{"key": "legal", "label": "法務", "desc": "青", "color": "#3B6EF0"}, {"key": "finance", "label": "経理", "desc": "青寄りの紺にすこし紫", "color": "#3D4AA8"}, {"key": "labor", "label": "労務", "desc": "赤よりのオレンジ", "color": "#E2592E"}, {"key": "recruiting", "label": "採用", "desc": "ライム寄りのミント", "color": "#2BB673"}, {"key": "general", "label": "総務", "desc": "オレンジ寄りの黄色", "color": "#F0A01E"}];
const APPS = [{"d": "legal", "id": "contract-creation", "name": "契約書自動作成", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><line x1=\"16\" y1=\"13\" x2=\"8\" y2=\"13\"/><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"/><polyline points=\"10 9 9 9 8 9\"/></svg>"}, {"d": "legal", "id": "contract-status-check", "name": "参画者契約管理", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M10.5 15H6a4 4 0 0 0-4 4v2\"/><path d=\"M15 12h4.5l3 3v6a1 1 0 0 1-1 1H15a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z\"/><path d=\"M19.5 12v3h3\"/><path d=\"M16.5 18.5h3\"/></svg>"}, {"d": "legal", "id": "legal-review-reminder", "name": "法務依頼管理", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v18\"/><path d=\"M7 21h10\"/><path d=\"M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2\"/><path d=\"m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z\"/><path d=\"m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z\"/></svg>"}, {"d": "finance", "id": "accounting-docs-filer", "name": "請求書・領収書仕分けBot", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/></svg>"}, {"d": "labor", "id": "members", "name": "参画者プロフィール", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M10.5 15H6a4 4 0 0 0-4 4v2\"/><circle cx=\"17.5\" cy=\"16.5\" r=\"3.5\"/><path d=\"m20.2 19.2 2.3 2.3\"/></svg>"}, {"d": "labor", "id": "line-onboarding-bot", "name": "新規参画者受入管理", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><polyline points=\"16 11 18 13 22 9\"/></svg>"}, {"d": "labor", "id": "attendance-dashboard", "name": "インターン出勤管理", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M10.5 15H6a4 4 0 0 0-4 4v2\"/><rect x=\"13\" y=\"12\" width=\"10\" height=\"10\" rx=\"2\"/><path d=\"M16 10.5v3M20 10.5v3\"/><path d=\"m15.6 17.2 1.6 1.6 3-3\"/></svg>"}, {"d": "recruiting", "id": "recruitment-dashboard", "name": "採用ダッシュボード", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M10.5 15H6a4 4 0 0 0-4 4v2\"/><path d=\"M15.5 18.5h7\"/><path d=\"M19 15v7\"/></svg>"}, {"d": "recruiting", "id": "message-generator", "name": "応募者メッセージ自動生成", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"20\" height=\"16\" x=\"2\" y=\"4\" rx=\"2\"/><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"/></svg>"}, {"d": "recruiting", "id": "event-management", "name": "イベント参加者変更管理", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"/><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"/><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"/><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"/></svg>"}, {"d": "general", "id": "timetree-event-writer", "name": "Anfini TimeTree", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/><path d=\"M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01\"/></svg>"}, {"d": "general", "id": "booth-dashboard", "name": "テレブース・会議室予約管理", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 8.71l-5.333 -4.148a2.666 2.666 0 0 0 -3.274 0l-5.334 4.148a2.665 2.665 0 0 0 -1.029 2.105v7.2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-7.2c0 -.823 -.38 -1.6 -1.03 -2.105\"/><path d=\"M16 15c-2.21 1.333 -5.792 1.333 -8 0\"/></svg>"}, {"d": "general", "id": "personal-dashboard", "name": "Personal Dashboard", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/></svg>"}, {"d": "general", "id": "outlook-timetree-sync", "name": "Outlook 同期", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"16\" rx=\"2\"/><path d=\"M16 3v4M8 3v4M4 11h16\"/><path d=\"M8.5 16h7M13 13.5l2.5 2.5-2.5 2.5\"/></svg>"}, {"d": "general", "id": "meet-link-issuer", "name": "Meetリンク発行", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"6\" width=\"14\" height=\"12\" rx=\"2\"/><path d=\"M16 10l6-3v10l-6-3\"/></svg>"}, {"d": "general", "id": "document-router", "name": "受信ファイル管理", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3v4a1 1 0 0 0 1 1h4\"/><path d=\"M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z\"/><path d=\"M12 13v4\"/><path d=\"M9.5 15l2.5 2l2.5 -2\"/></svg>"}];
const CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10"/></svg>';
const KEY = 'theme-colors-v1';
let colors = {};
try { colors = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
DOMAINS.forEach(d => { if (!/^#[0-9A-F]{6}$/i.test(colors[d.key] || '')) colors[d.key] = d.color; });
const hx = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => v * (1 - t) + B[i] * t)); };
const lum = c => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; const [r, g, b] = hx(c).map(f); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function save() { try { localStorage.setItem(KEY, JSON.stringify(colors)); } catch (e) {} }
function render() {
  document.getElementById('list').innerHTML = DOMAINS.map(d => {
    const apps = APPS.filter(a => a.d === d.key).map(a => '<div class="app"><div class="pair"><span class="logo" data-k="' + d.key + '">' + a.svg + '</span><span class="tile" data-k="' + d.key + '">' + a.svg + '</span></div><div class="n">' + a.name + '</div></div>').join('');
    return '<section class="card" data-sec="' + d.key + '"><div class="head"><h2>' + d.label + '</h2><span class="desc">' + d.desc + '</span>' +
      '<div class="picker"><input type="color" data-k="' + d.key + '"><input type="text" maxlength="7" data-k="' + d.key + '"><span class="cr" data-cr="' + d.key + '"></span></div></div>' +
      '<div class="body"><div class="parts">' +
      '<div class="row"><span class="sw" data-p="main"></span><span class="sw" data-p="light"></span><span class="sw" data-p="dark"></span><span class="lbl">メイン・薄い背景・濃い文字</span></div>' +
      '<div class="row"><button class="sbtn" type="button">保存</button><span class="tab">選択中のタブ</span></div>' +
      '<div class="row"><span class="badge">バッジ</span><span class="link">リンク</span><span class="cb">' + CHECK + '</span></div>' +
      '</div><div class="apps">' + apps + '</div></div></section>';
  }).join('');
  document.querySelectorAll('.picker input').forEach(inp => {
    inp.addEventListener('input', () => {
      let v = inp.value.trim().toUpperCase();
      if (inp.type === 'text') { if (!v.startsWith('#')) v = '#' + v; if (!/^#[0-9A-F]{6}$/.test(v)) return; }
      colors[inp.dataset.k] = v.toUpperCase(); save(); paint();
    });
  });
  paint();
}
function paint() {
  DOMAINS.forEach(d => {
    const c = colors[d.key], light = mix(c, '#FFFFFF', 0.9), dark = mix(c, '#000000', 0.25);
    const sec = document.querySelector('[data-sec="' + d.key + '"]');
    sec.querySelectorAll('.picker input').forEach(i => { if (document.activeElement !== i) i.value = c; });
    const cr = contrast(c, '#FFFFFF'), el = sec.querySelector('[data-cr]');
    el.textContent = '白文字のコントラスト ' + cr.toFixed(1); el.classList.toggle('ng', cr < 3);
    sec.querySelector('[data-p=main]').style.background = c;
    sec.querySelector('[data-p=light]').style.background = light;
    sec.querySelector('[data-p=dark]').style.background = dark;
    sec.querySelector('.sbtn').style.background = c;
    sec.querySelectorAll('.tab,.badge').forEach(e => { e.style.background = light; e.style.color = dark; });
    sec.querySelector('.link').style.color = dark;
    sec.querySelector('.cb').style.background = c;
    sec.querySelectorAll('.logo').forEach(e => { e.style.background = c; });
    sec.querySelectorAll('.tile').forEach(e => { e.style.background = mix(c, '#FFFFFF', 0.88); e.style.color = c; });
  });
  document.getElementById('strip').innerHTML = DOMAINS.map(d => '<div><span style="background:' + colors[d.key] + '"></span>' + d.label + '</div>').join('');
  document.getElementById('out').value = DOMAINS.map(d => { const c = colors[d.key]; return d.label + '\t' + c + '\t薄い背景 ' + mix(c, '#FFFFFF', 0.9) + '\t濃い文字 ' + mix(c, '#000000', 0.25); }).join('\n');
}
document.getElementById('reset').addEventListener('click', () => { DOMAINS.forEach(d => { colors[d.key] = d.color; }); save(); paint(); });
document.getElementById('copy').addEventListener('click', async e => {
  const t = document.getElementById('out').value;
  try { await navigator.clipboard.writeText(t); } catch (x) { const o = document.getElementById('out'); o.select(); document.execCommand('copy'); }
  e.target.textContent = 'コピーしました'; setTimeout(() => { e.target.textContent = '決めた色をコピー'; }, 1500);
});
render();
</script>
</body>
</html>
